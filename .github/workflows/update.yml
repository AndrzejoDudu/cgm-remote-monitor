name: Aktualizacja Nightscout

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Aktualizuj na Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --image nightscout/cgm-remote-monitor:latest --remote-only -a andrzejdudu
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
